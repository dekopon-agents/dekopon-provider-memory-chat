name: Recover v0.1.0 from immutable tagged artifacts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact acknowledgement for the one pinned recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "32827819089"
  SOURCE_RUN_ATTEMPT: "1"
  SOURCE_SHA: 564abc55c8e01657ddb0e10938b9f62101e558ae
  SOURCE_TAG: v0.1.0
  SOURCE_TAG_OBJECT: 5bcd812905abe6fd9564be1366b955a9da5a921c
  SOURCE_REF: refs/tags/v0.1.0
  EXPECTED_SHA: 65f82d6a422b0500269333b79be06c4155d7793df1f80ced12a8b214acb53a6b
  EXPECTED_SBOM_SHA: 0608a6503400bd57e4c24f3ec6f0d0b812ad4be0e8acf1f831f1d579e1d72234
  RECOVERY_CONFIRMATION: recover-v0.1.0-from-run-32827819089
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: ghcr.io/dekopon-agents/provider-memory-chat

jobs:
  build:
    name: recover and verify immutable tagged bytes
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Verify green recovery CI and download the two exact source artifacts.
      contents: read # Verify current main, annotated tag, and release absence.
      packages: read # Prove the final GHCR package remains absent.
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out auditable recovery main without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify confirmation, recovery scope, green CI, tag, and destination absence
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = dekopon-agents/dekopon-provider-memory-chat
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = "$RECOVERY_CONFIRMATION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$SOURCE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$SOURCE_TAG")" = "$SOURCE_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$SOURCE_TAG^{}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          changed=$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA" | LC_ALL=C sort)
          test "$changed" = $'.github/workflows/recover-v0.1.0.yml\n.github/workflows/release.yml\nscripts/recover-v0.1.0-artifacts.sh\nscripts/validate-workflows.sh'

          gh api --paginate --slurp             "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"             >"$RUNNER_TEMP/main-runs.jsons"
          jq -e --arg sha "$GITHUB_SHA" '
            [.[].workflow_runs[] | select(
              .name == "CI" and .path == ".github/workflows/ci.yml" and
              .event == "push" and .head_sha == $sha and
              .status == "completed" and .conclusion == "success"
            )] | length == 1
          ' "$RUNNER_TEMP/main-runs.jsons" >/dev/null

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG"             >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err"; then
            echo 'error: v0.1.0 release already exists' >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/release.err"
          if gh api /orgs/dekopon-agents/packages/container/provider-memory-chat             >"$RUNNER_TEMP/package.json" 2>"$RUNNER_TEMP/package.err"; then
            echo 'error: provider-memory-chat package already exists' >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/package.err"
          echo 'version=0.1.0' >>"$GITHUB_OUTPUT"

      - name: Download and independently verify only the tagged run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: ./scripts/recover-v0.1.0-artifacts.sh "$RUNNER_TEMP/tagged"
      - name: Stage exact source artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/tagged/component" "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP/tagged/sbom/memory-chat-provider.cdx.json" "$RUNNER_TEMP/"
          ./scripts/verify-release-assets.sh "$PWD/dist"
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(sha256sum dist/memory-chat-provider.wasm | awk '{print $1}')" =             "$EXPECTED_SHA"
          test "$(sha256sum "$RUNNER_TEMP/memory-chat-provider.cdx.json" | awk '{print $1}')" =             "$EXPECTED_SBOM_SHA"
          git diff --exit-code
      - name: Re-upload exact tagged component for permission-separated recovery jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Re-upload exact tagged SBOM for independent attestation verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: ${{ runner.temp }}/memory-chat-provider.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: verify existing tagged provenance and SBOM attestations
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified copies of source artifacts.
      contents: read # Check out the immutable tagged verifier; create no replacement attestation.
    steps:
      - name: Check out immutable tagged verifier without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download exact recovery component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Download exact recovery SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sbom
          path: sbom
      - name: Verify bytes, SBOM, and both original tag-run identities
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict memory-chat-provider.wasm.sha256)
          test "$(sha256sum sbom/memory-chat-provider.cdx.json | awk '{print $1}')" =             "$EXPECTED_SBOM_SHA"
          for predicate in 'https://slsa.dev/provenance/v1' 'https://cyclonedx.org/bom'; do
            ./scripts/verify-attestation-anonymously.sh               dist/memory-chat-provider.wasm "$GITHUB_REPOSITORY" "$EXPECTED_SHA"               "$predicate" "$GITHUB_REPOSITORY/.github/workflows/release.yml"               "$SOURCE_REF" "$SOURCE_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
          done

  draft:
    name: create and verify run-owned exact draft
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified source artifacts.
      contents: write # Create, read, upload to, and delete only the captured draft release.
      attestations: read # Verify only the pinned tag-run attestations.
      packages: read # Prove final package absence before creating the draft.
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      marker: ${{ steps.create.outputs.marker }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Install pinned component validator
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Verify assets and both attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh "$PWD/dist"
          gh attestation verify dist/memory-chat-provider.wasm --repo "$GITHUB_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify dist/memory-chat-provider.wasm --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
      - name: Prove the release and entire final GHCR package are absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" \
            >"$RUNNER_TEMP/existing-release.json" 2>"$RUNNER_TEMP/release.err"; then
            echo "error: immutable v0.1.0 release already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/release.err"
          if gh api /orgs/dekopon-agents/packages/container/provider-memory-chat \
            >"$RUNNER_TEMP/existing-package.json" 2>"$RUNNER_TEMP/package.err"; then
            echo "error: final provider-memory-chat package already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/package.err"
      - name: Create a run-marked draft with exactly two assets
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="provider-memory-chat-run:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          printf '%s\n\nAwaiting verified OCI manifest before finalization.\n' "$marker" \
            >"$RUNNER_TEMP/draft-notes.md"
          gh release create v0.1.0 --verify-tag --draft --title v0.1.0 \
            --notes-file "$RUNNER_TEMP/draft-notes.md" \
            dist/memory-chat-provider.wasm dist/memory-chat-provider.wasm.sha256
          release_id=
          for _attempt in {1..30}; do
            release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -sr --arg marker "$marker" '
                [.[][] | select(
                  .draft == true and .tag_name == "v0.1.0" and
                  ((.body // "") | startswith($marker))
                )] |
                if length == 1 then .[0].id elif length == 0 then empty
                else error("run-owned draft cardinality") end
              ')
            [[ -z "$release_id" ]] || break
            sleep 2
          done
          [[ "$release_id" =~ ^[0-9]+$ ]] && test "$release_id" -gt 0
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "marker=$marker" >>"$GITHUB_OUTPUT"
      - name: Redownload both draft assets by ID and compare bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          MARKER: ${{ steps.create.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker)) and
            ([.assets[].name] | sort) ==
              ["memory-chat-provider.wasm", "memory-chat-provider.wasm.sha256"]
          ' "$RUNNER_TEMP/draft.json" >/dev/null
          mkdir "$RUNNER_TEMP/draft-assets"
          for name in memory-chat-provider.wasm memory-chat-provider.wasm.sha256; do
            asset_id=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("asset cardinality") end
            ' "$RUNNER_TEMP/draft.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/draft-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/draft-assets/$name"
          done
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/draft-assets"

  ghcr:
    name: publish direct-final one-layer GHCR artifact and verify anonymously
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified source artifacts.
      # Draft releases are visible to this job only with writable contents access.
      contents: write # Read only the captured draft; no contents mutation occurs in this job.
      packages: write # Create, validate, and publicize only the previously absent final package.
    outputs:
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
    steps:
      - name: Check out manifest verifier without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Install pinned ORAS from its verified archive
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
          (cd dist && sha256sum --check --strict memory-chat-provider.wasm.sha256)
      - name: Authenticate only for the final push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only 0.1.0, verify manifest, make public, and pull anonymously
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          run="$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          ref="$OCI_REPOSITORY:$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/owned-draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/owned-draft.json" >/dev/null
          if "$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$ref" \
            >"$RUNNER_TEMP/existing.json" 2>"$RUNNER_TEMP/existing.err"; then
            echo "error: immutable final OCI reference already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' "$RUNNER_TEMP/existing.err"
          # Push from dist so the OCI layer title is the asset basename, not a workspace path.
          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$ref" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$SOURCE_SHA" \
              --annotation "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.provider.capability=memory.chat.record,memory.chat.recent,memory.chat.search" \
              memory-chat-provider.wasm:application/wasm
          )
          digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$ref" | jq -er .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "manifest_digest=$digest" >>"$GITHUB_OUTPUT"
          "$RUNNER_TEMP/oras-bin" manifest fetch "$OCI_REPOSITORY@$digest" \
            >"$RUNNER_TEMP/authenticated-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/authenticated-manifest.json" \
            dist/memory-chat-provider.wasm "$run" "$SOURCE_SHA"

          for _ in {1..30}; do
            visibility=$(gh api /orgs/dekopon-agents/packages/container/provider-memory-chat \
              --jq .visibility 2>/dev/null || true)
            if [[ "$visibility" == public ]]; then break; fi
            if [[ "$visibility" == private ]]; then
              gh api --method PATCH \
                /orgs/dekopon-agents/packages/container/provider-memory-chat \
                -f visibility=public >/dev/null
            fi
            sleep 2
          done
          test "$(gh api /orgs/dekopon-agents/packages/container/provider-memory-chat --jq .visibility)" = public

          docker logout ghcr.io
          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin")
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = "$digest"
          "${anonymous[@]}" manifest fetch "$ref" >"$RUNNER_TEMP/anonymous-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/anonymous-manifest.json" \
            dist/memory-chat-provider.wasm "$run" "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/anonymous-pull"
          "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/anonymous-pull"
          test "$(find "$RUNNER_TEMP/anonymous-pull" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/memory-chat-provider.wasm "$RUNNER_TEMP/anonymous-pull/memory-chat-provider.wasm"
          expected=$(awk '{print $1}' dist/memory-chat-provider.wasm.sha256)
          test "sha256:$expected" = "$(jq -er '.layers[0].digest' "$RUNNER_TEMP/anonymous-manifest.json")"

          gh api --paginate \
            /orgs/dekopon-agents/packages/container/provider-memory-chat/versions?per_page=100 \
            >"$RUNNER_TEMP/versions.jsons"
          jq -se --arg digest "$digest" '
            [.[][]] as $versions |
            ($versions | length) == 1 and
            $versions[0].name == $digest and
            (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
          ' "$RUNNER_TEMP/versions.jsons" >/dev/null

  finalize:
    name: verify public bytes and finalize release as the last mutation
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified source artifacts.
      contents: write # Read draft assets and finalize only the captured release ID.
      packages: read # Recheck exact final package/version cardinality before publication.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Re-peel immutable tag and current main immediately before finalization
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git cat-file -t "refs/tags/$SOURCE_TAG")" = tag
          test "$(git rev-parse "$SOURCE_TAG^{}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
      - name: Install pinned ORAS and component validator
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Recheck draft assets and every anonymous OCI byte, then finalize
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          run="$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          ref="$OCI_REPOSITORY:$VERSION"
          ./scripts/verify-release-assets.sh "$PWD/dist"
          component_sha=$(sha256sum dist/memory-chat-provider.wasm | awk '{print $1}')
          ./scripts/verify-attestation-anonymously.sh \
            dist/memory-chat-provider.wasm "$GITHUB_REPOSITORY" "$component_sha" \
            https://slsa.dev/provenance/v1 \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml" "$SOURCE_REF" "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
          ./scripts/verify-attestation-anonymously.sh \
            dist/memory-chat-provider.wasm "$GITHUB_REPOSITORY" "$component_sha" \
            https://cyclonedx.org/bom \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml" "$SOURCE_REF" "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/final-draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker)) and
            ([.assets[].name] | sort) ==
              ["memory-chat-provider.wasm", "memory-chat-provider.wasm.sha256"]
          ' "$RUNNER_TEMP/final-draft.json" >/dev/null
          mkdir "$RUNNER_TEMP/final-draft-assets"
          for name in memory-chat-provider.wasm memory-chat-provider.wasm.sha256; do
            asset_id=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("asset cardinality") end
            ' "$RUNNER_TEMP/final-draft.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/final-draft-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/final-draft-assets/$name"
          done
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/final-draft-assets"

          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras")
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = "$MANIFEST_DIGEST"
          "${anonymous[@]}" manifest fetch "$ref" >"$RUNNER_TEMP/final-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/final-manifest.json" \
            dist/memory-chat-provider.wasm "$run" "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/final-pull"
          "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/final-pull"
          test "$(find "$RUNNER_TEMP/final-pull" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/memory-chat-provider.wasm "$RUNNER_TEMP/final-pull/memory-chat-provider.wasm"

          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          $MARKER

          Broker-only durable chat memory using broker-owned JSONL storage and invocation transactions. OCI manifest:
          \`$OCI_REPOSITORY@$MANIFEST_DIGEST\` (tag \`0.1.0\`). The anonymous OCI layer is byte-identical
          to \`memory-chat-provider.wasm\`; verify it with the attached SHA-256 file.

          Requires Dekopon 0.11.1 broker-owned JSONL storage, opaque chat namespaces, broker-curated
          limits, and invocation-level transaction commit/rollback. Direct runner cannot load it.
          Recording remains hidden; retrieved text is untrusted and never automatically replayed.
          Changing provider bytes rotates authority-bound continuity. No latest or temporary tag is
          published. The binary distribution license expression is **MIT OR Apache-2.0**.
          EOF
          test "$(wc -c <"$RUNNER_TEMP/release-notes.md")" -le 125000
          jq -n --rawfile body "$RUNNER_TEMP/release-notes.md" '{
            draft: false,
            prerelease: false,
            make_latest: "false",
            name: "v0.1.0",
            body: $body
          }' >"$RUNNER_TEMP/publish.json"

          # Revalidate the complete public OCI and owned-draft cardinality immediately before the
          # final mutation. A concurrent extra tag, version, or run-owned draft must stop release.
          test "$("${anonymous[@]}" repo tags "$OCI_REPOSITORY" | LC_ALL=C sort)" = \
            "0.1.0"
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = \
            "$MANIFEST_DIGEST"
          gh api --paginate \
            /orgs/dekopon-agents/packages/container/provider-memory-chat/versions?per_page=100 \
            >"$RUNNER_TEMP/final-versions.jsons"
          jq -se --arg digest "$MANIFEST_DIGEST" '
            [.[][]] as $versions |
            ($versions | length) == 1 and
            $versions[0].name == $digest and
            (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
          ' "$RUNNER_TEMP/final-versions.jsons" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s --arg marker "$MARKER" --arg release_id "$RELEASE_ID" '
              [.[][] | select(
                .draft == true and .tag_name == "v0.1.0" and
                ((.body // "") | startswith($marker))
              )] |
              length == 1 and (.[0].id | tostring) == $release_id
            ' >"$RUNNER_TEMP/final-owned-draft.json"
          jq -e '. == true' "$RUNNER_TEMP/final-owned-draft.json" >/dev/null

          # This PATCH is the release transaction's final mutation. Everything above is read-only.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/publish.json" >"$RUNNER_TEMP/published.json"
          jq -e --arg marker "$MARKER" '
            .draft == false and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/published.json" >/dev/null

  anonymous_verify:
    name: credentials-free public release, attestations, and OCI verification
    needs: [build, draft, ghcr, finalize]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Check out only the immutable tagged public verifier scripts.
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Install pinned anonymous validators
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
      - name: Verify every public byte without credentials
        env:
          EXPECTED_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location "$api" >"$RUNNER_TEMP/release.json"
          jq -e '.draft == false and .prerelease == false and ([.assets[].name] | sort) == ["memory-chat-provider.wasm","memory-chat-provider.wasm.sha256"]' "$RUNNER_TEMP/release.json" >/dev/null
          mkdir "$RUNNER_TEMP/public"
          for name in memory-chat-provider.wasm memory-chat-provider.wasm.sha256; do
            url=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
            env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location "$url" -o "$RUNNER_TEMP/public/$name"
          done
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/public"
          sha=$(sha256sum "$RUNNER_TEMP/public/memory-chat-provider.wasm" | awk '{print $1}')
          ./scripts/verify-attestation-anonymously.sh "$RUNNER_TEMP/public/memory-chat-provider.wasm" "$GITHUB_REPOSITORY" "$sha" https://slsa.dev/provenance/v1 "$GITHUB_REPOSITORY/.github/workflows/release.yml" "$SOURCE_REF" "$SOURCE_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
          ./scripts/verify-attestation-anonymously.sh "$RUNNER_TEMP/public/memory-chat-provider.wasm" "$GITHUB_REPOSITORY" "$sha" https://cyclonedx.org/bom "$GITHUB_REPOSITORY/.github/workflows/release.yml" "$SOURCE_REF" "$SOURCE_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras")
          ref="$OCI_REPOSITORY:$VERSION"
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = "$EXPECTED_DIGEST"
          mkdir "$RUNNER_TEMP/oci"; "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/oci"
          cmp "$RUNNER_TEMP/public/memory-chat-provider.wasm" "$RUNNER_TEMP/oci/memory-chat-provider.wasm"

  cleanup_failed_release:
    name: remove only this failed run's proven release and sole final manifest
    if: ${{ always() && needs.anonymous_verify.result != 'success' }}
    needs: [build, draft, ghcr, finalize, anonymous_verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Delete only this recovery run's marker-owned release on failure.
      packages: write # Delete only this recovery run's exact previously absent package.
    steps:
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Authenticate for narrowly verified cleanup
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify run ownership and remove OCI effect before draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          EXPECTED_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run="$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          expected_marker="provider-memory-chat-run:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          [[ -z "$MARKER" || "$MARKER" == "$expected_marker" ]]
          [[ -z "$EXPECTED_DIGEST" || "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_id=$RELEASE_ID
          release_owned=false
          if [[ -n "$release_id" ]]; then
            [[ "$release_id" =~ ^[0-9]+$ ]]
            endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            endpoint="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          fi
          if [[ -n "$release_id" ]]; then
            gh api "$endpoint" >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err" || true
          else
            gh api --paginate "$endpoint" | jq -s 'add' >"$RUNNER_TEMP/releases.json"
            jq --arg marker "$expected_marker" '
              [.[] | select(
                .tag_name == "v0.1.0" and ((.body // "") | startswith($marker))
              )] |
              if length == 1 then .[0] elif length == 0 then null
              else error("multiple run-owned releases") end
            ' "$RUNNER_TEMP/releases.json" >"$RUNNER_TEMP/release.json"
          fi
          if jq -e --arg marker "$expected_marker" '
            . != null and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
            release_owned=true
            release_id=$(jq -er .id "$RUNNER_TEMP/release.json")
            jq -e '(.draft == true) or (.draft == false and .prerelease == false)' \
              "$RUNNER_TEMP/release.json" >/dev/null
          fi

          ref="$OCI_REPOSITORY:0.1.0"
          digest=
          if descriptor=$("$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
            2>"$RUNNER_TEMP/descriptor.err"); then
            digest=$(jq -er .digest <<<"$descriptor")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ -z "$EXPECTED_DIGEST" || "$digest" == "$EXPECTED_DIGEST" ]]
            "$RUNNER_TEMP/oras" manifest fetch "$OCI_REPOSITORY@$digest" \
              >"$RUNNER_TEMP/owned-manifest.json"
            jq -e --arg run "$run" --arg revision "$SOURCE_SHA" '
              .artifactType == "application/vnd.dekopon.provider.v1+wasm" and
              .annotations["org.dekopon.release.run"] == $run and
              .annotations["org.opencontainers.image.source"] ==
                "https://github.com/dekopon-agents/dekopon-provider-memory-chat" and
              .annotations["org.opencontainers.image.version"] == "0.1.0" and
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["org.opencontainers.image.licenses"] ==
                "MIT OR Apache-2.0" and
              (.layers | length) == 1 and .layers[0].mediaType == "application/wasm"
            ' "$RUNNER_TEMP/owned-manifest.json" >/dev/null

            gh api --paginate \
              /orgs/dekopon-agents/packages/container/provider-memory-chat/versions?per_page=100 \
              >"$RUNNER_TEMP/cleanup-versions.jsons"
            jq -se --arg digest "$digest" '
              [.[][]] as $versions |
              ($versions | length) == 1 and
              $versions[0].name == $digest and
              (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
            ' "$RUNNER_TEMP/cleanup-versions.jsons" >/dev/null
            package=$(gh api \
              /orgs/dekopon-agents/packages/container/provider-memory-chat)
            jq -e '
              .name == "provider-memory-chat" and .package_type == "container" and
              (.visibility == "private" or .visibility == "public")
            ' <<<"$package" >/dev/null
            # GitHub refuses deletion of the sole tagged version. After proving this run owns the
            # package's only manifest/version, delete the whole previously absent package.
            gh api --method DELETE \
              /orgs/dekopon-agents/packages/container/provider-memory-chat
            if "$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
              >/dev/null 2>"$RUNNER_TEMP/deleted.err"; then
              # Registry deletion is eventually consistent; the bounded absence poll below owns
              # the deadline and verifies the complete package, not only this mutable reference.
              :
            elif ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/deleted.err"; then
              cat "$RUNNER_TEMP/deleted.err" >&2
              exit 1
            fi
          elif ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
            "$RUNNER_TEMP/descriptor.err"; then
            cat "$RUNNER_TEMP/descriptor.err" >&2
            exit 1
          fi

          if [[ "$release_owned" == true ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

          api_absent() {
            local endpoint=$1
            local label=$2
            if gh api "$endpoint" >"$RUNNER_TEMP/$label.json" \
              2>"$RUNNER_TEMP/$label.err"; then
              return 1
            fi
            grep -Eqi 'not found|404' "$RUNNER_TEMP/$label.err"
          }

          restored=false
          for _attempt in {1..30}; do
            release_id_absent=true
            if [[ -n "$release_id" ]] && ! api_absent \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" cleanup-release-id; then
              release_id_absent=false
            fi
            release_tag_absent=false
            if api_absent "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" \
              cleanup-release-tag; then
              release_tag_absent=true
            fi
            oci_absent=false
            if "$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
              >"$RUNNER_TEMP/cleanup-oci.json" 2>"$RUNNER_TEMP/cleanup-oci.err"; then
              :
            elif grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/cleanup-oci.err"; then
              oci_absent=true
            else
              cat "$RUNNER_TEMP/cleanup-oci.err" >&2
              exit 1
            fi
            package_absent=false
            if api_absent \
              /orgs/dekopon-agents/packages/container/provider-memory-chat \
              cleanup-package; then
              package_absent=true
            fi
            if [[ "$release_id_absent" == true && "$release_tag_absent" == true && \
                  "$oci_absent" == true && "$package_absent" == true ]]; then
              restored=true
              break
            fi
            sleep 2
          done
          if [[ "$restored" != true ]]; then
            echo "error: failed cleanup did not restore original release/package absence" >&2
            exit 1
          fi
