[workspace]

[package]
name = "dekopon-memory-chat-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Broker-only durable JSONL chat-memory provider for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-memory-chat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.13.0"
dekopon-provider-storage = { version = "=0.13.0", default-features = false, features = ["jsonl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.13.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
